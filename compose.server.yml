name: jaga-claim

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-jaga_claim}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jaga_claim}?schema=public
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS website origin}
  ADMIN_LOGIN_EMAIL: ${ADMIN_LOGIN_EMAIL:-admin@jagaclaim.local}
  REVIEWER_LOGIN_EMAIL: ${REVIEWER_LOGIN_EMAIL:-reviewer@jagaclaim.local}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
  REVIEWER_PASSWORD_HASH: ${REVIEWER_PASSWORD_HASH:?Set REVIEWER_PASSWORD_HASH}
  SCORING_PROVIDER: http
  ML_SERVICE_URL: ${ML_SERVICE_URL:?Set reachable ML API URL}
  ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
  ML_SERVICE_TIMEOUT_MS: ${ML_SERVICE_TIMEOUT_MS:-5000}
  ML_EXPLAIN_TIMEOUT_MS: ${ML_EXPLAIN_TIMEOUT_MS:-25000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jaga_claim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jaga_claim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${JAGA_CLAIM_IMAGE:?Set Docker Hub image and tag}
    restart: "no"
    environment: *app-environment
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${JAGA_CLAIM_IMAGE:?Set Docker Hub image and tag}
    restart: unless-stopped
    init: true
    environment: *app-environment
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
